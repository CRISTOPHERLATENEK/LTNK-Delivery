<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="700" height="360" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif">
  <rect width="700" height="360" fill="#fff"/>
  <text x="24" y="30" font-size="15" font-weight="700" fill="#111">Como os sabores são cobrados</text>
  <text x="24" y="50" font-size="12.5" fill="#8a8a8a">o mesmo pedido, nos três modos de preço do grupo</text>

  <rect x="24" y="68" width="652" height="52" rx="10" fill="#fafaf9" stroke="#e3e0dc"/>
  <text x="40" y="90" font-size="12.5" font-weight="700" fill="#111">Pizza grande, 4 sabores</text>
  <text x="40" y="109" font-size="12.5" fill="#8a8a8a">Calabresa (incluso) · Camarão (+R$ 24) · Atum (+R$ 14) · 4 Queijos (+R$ 10)</text>

  <g font-size="13">
    <rect x="24" y="136" width="652" height="56" rx="10" fill="#fff" stroke="#e3e0dc"/>
    <text x="44" y="160" font-weight="700" fill="#111">somar</text>
    <text x="44" y="180" font-size="12.5" fill="#8a8a8a">soma todos os adicionais</text>
    <text x="640" y="168" text-anchor="end" font-size="17" font-weight="800" fill="#a33a28">R$ 93,00</text>
    <text x="470" y="168" text-anchor="end" font-size="12.5" fill="#8a8a8a">45 + 24 + 14 + 10</text>

    <rect x="24" y="200" width="652" height="56" rx="10" fill="#fff" stroke="#e3e0dc"/>
    <text x="44" y="224" font-weight="700" fill="#111">maior</text>
    <text x="44" y="244" font-size="12.5" fill="#8a8a8a">cobra só o sabor mais caro</text>
    <text x="640" y="232" text-anchor="end" font-size="17" font-weight="800" fill="#111">R$ 69,00</text>
    <text x="470" y="232" text-anchor="end" font-size="12.5" fill="#8a8a8a">45 + 24</text>

    <rect x="24" y="264" width="652" height="56" rx="10" fill="#fff" stroke="#e3e0dc"/>
    <text x="44" y="288" font-weight="700" fill="#111">proporcional</text>
    <text x="44" y="308" font-size="12.5" fill="#8a8a8a">divide pelos pedaços</text>
    <text x="640" y="296" text-anchor="end" font-size="17" font-weight="800" fill="#111">R$ 57,00</text>
    <text x="470" y="296" text-anchor="end" font-size="12.5" fill="#8a8a8a">45 + (24+14+10) ÷ 4</text>
  </g>

  <path d="M24 336 h652" stroke="#e8e5e1"/>
  <text x="24" y="354" font-size="12.5" fill="#444">
    <tspan font-weight="700">Pizzaria costuma usar maior ou proporcional.</tspan>
    <tspan fill="#8a8a8a"> Com somar, uma pizza de 4 sabores caros fica impagável.</tspan>
  </text>
</svg>
