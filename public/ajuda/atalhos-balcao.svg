<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif">
  <rect width="700" height="300" fill="#fff"/>
  <text x="24" y="30" font-size="15" font-weight="700" fill="#111">Escolher pelo número</text>
  <text x="24" y="50" font-size="12.5" fill="#8a8a8a">a mão não sai do teclado</text>

  <g font-family="ui-monospace, SF Mono, Consolas, monospace">
    <rect x="24" y="72" width="46" height="34" rx="7" fill="#fafaf9" stroke="#a8a29e"/>
    <text x="47" y="95" text-anchor="middle" font-size="15" font-weight="700" fill="#111">3</text>
    <rect x="24" y="120" width="46" height="34" rx="7" fill="#fafaf9" stroke="#a8a29e"/>
    <text x="47" y="143" text-anchor="middle" font-size="15" font-weight="700" fill="#111">1</text>
    <rect x="24" y="176" width="46" height="34" rx="7" fill="#fafaf9" stroke="#a8a29e"/>
    <text x="47" y="199" text-anchor="middle" font-size="14" font-weight="700" fill="#111">99</text>
  </g>

  <text x="88" y="86" font-size="13" font-weight="700" fill="#111">Marca na hora</text>
  <text x="88" y="104" font-size="12.5" fill="#8a8a8a">só existe uma opção começando com 3</text>

  <text x="88" y="134" font-size="13" font-weight="700" fill="#111">Espera o segundo dígito</text>
  <text x="88" y="152" font-size="12.5" fill="#8a8a8a">pode virar 1, 12 ou 19 — o número digitado aparece no topo</text>

  <text x="88" y="190" font-size="13" font-weight="700" fill="#a33a28">99 · não existe</text>
  <text x="88" y="208" font-size="12.5" fill="#8a8a8a">o número não está na lista. Não é a tecla que falhou</text>

  <rect x="24" y="230" width="652" height="0.5" fill="#e8e5e1"/>
  <g font-size="12.5">
    <text x="24" y="254" font-weight="700" fill="#111">Enter</text>
    <text x="90" y="254" fill="#8a8a8a">adiciona à venda</text>
    <text x="240" y="254" font-weight="700" fill="#111">Esc</text>
    <text x="290" y="254" fill="#8a8a8a">cancela o item</text>
    <text x="440" y="254" font-weight="700" fill="#111">Backspace</text>
    <text x="530" y="254" fill="#8a8a8a">limpa o número</text>
  </g>
  <text x="24" y="284" font-size="12.5" fill="#444">
    <tspan font-weight="700">Botão claro não é botão travado.</tspan>
    <tspan fill="#8a8a8a"> Falta alguma escolha — clique nele e ele leva até o grupo que falta.</tspan>
  </text>
</svg>
