<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif">
  <rect width="700" height="300" fill="#fff"/>
  <text x="24" y="30" font-size="15" font-weight="700" fill="#111">Pagamento online: teste antes de produção</text>
  <text x="24" y="50" font-size="12.5" fill="#8a8a8a">os dois modos usam a SUA conta, com um token cada</text>

  <rect x="24" y="72" width="316" height="164" rx="12" fill="#fff" stroke="#e3e0dc"/>
  <rect x="44" y="92" width="90" height="28" rx="8" fill="#fafaf9" stroke="#d8d4cf"/>
  <text x="89" y="111" text-anchor="middle" font-size="12.5" font-weight="700" fill="#111">TESTE</text>
  <text x="44" y="144" font-size="13" font-weight="700" fill="#111">Exercita tudo, sem dinheiro</text>
  <g font-size="12.5" fill="#8a8a8a">
    <text x="44" y="166">QR aparece</text>
    <text x="44" y="185">confirmação chega</text>
    <text x="44" y="204">pedido entra no painel</text>
    <text x="44" y="223">cupom imprime</text>
  </g>

  <rect x="360" y="72" width="316" height="164" rx="12" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <rect x="380" y="92" width="112" height="28" rx="8" fill="#f1f7f2" stroke="#d3e5d7"/>
  <text x="436" y="111" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2f6b41">PRODUÇÃO</text>
  <text x="380" y="144" font-size="13" font-weight="700" fill="#111">O que o teste não prova</text>
  <g font-size="12.5" fill="#8a8a8a">
    <text x="380" y="166">o dinheiro cai na sua conta</text>
    <text x="380" y="185">a chave Pix real funciona</text>
    <text x="380" y="204">o webhook está cadastrado</text>
    <text x="380" y="223">na aplicação de produção</text>
  </g>

  <path d="M340 154 h14" stroke="#c9c4be" stroke-width="1.5"/>
  <path d="M348 149 l6 5 l-6 5" fill="none" stroke="#c9c4be" stroke-width="1.5"/>

  <path d="M24 256 h652" stroke="#e8e5e1"/>
  <text x="24" y="276" font-size="12.5" fill="#444">
    <tspan font-weight="700">Teste o estorno uma vez, com valor pequeno.</tspan>
    <tspan fill="#8a8a8a"> Recusar um pedido pago devolve o dinheiro automaticamente —</tspan>
  </text>
  <text x="24" y="292" font-size="12.5" fill="#8a8a8a">é o caminho que ninguém conhece até precisar dele com o cliente cobrado.</text>
</svg>
