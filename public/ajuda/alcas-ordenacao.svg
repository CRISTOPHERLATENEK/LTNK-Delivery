<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 624" width="900" height="624" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif">
<!--
  ESTA TELA FOI LIDA DO PAINEL DE VERDADE, não desenhada de memória.

  Os retângulos e textos abaixo saíram do DOM da tela Produtos rodando em
  produção (getBoundingClientRect + getComputedStyle): posição, tamanho, raio de
  canto, peso da fonte e cor. É por isso que o desenho bate com o que o lojista
  tem na frente — e é por isso que ele pode ser REGERADO quando a interface
  mudar, em vez de redesenhado de memória e envelhecer errado.

  Acrescentado à mão: as alças/setas (são ícones SVG, não texto, então não vêm
  na leitura) e as marcações.

  As marcações ficam AO LADO do alvo, nunca em cima: um número cobrindo a alça
  esconderia justamente a coisa que a imagem existe para mostrar. A explicação
  vai embaixo, onde há largura para uma frase inteira.
-->
<rect width="900" height="624" fill="#fff"/>
<defs>
  <!-- Os cartões cortam o texto que não cabe (overflow hidden na tela real).
       Sem isto o nome do produto escapa para fora do cartão, que é justamente
       o erro que a tela NÃO comete. -->
  <clipPath id="cardEsq"><rect x="109" y="99" width="528" height="189" rx="18"/></clipPath>
  <clipPath id="cardDir"><rect x="653" y="99" width="320" height="189" rx="18"/></clipPath>
  <clipPath id="linhaEsq"><rect x="109" y="304" width="528" height="56" rx="18"/></clipPath>
  <clipPath id="linhaDir"><rect x="653" y="304" width="320" height="56" rx="18"/></clipPath>
</defs>


<text x="20" y="22" font-size="14.5" font-weight="700" fill="#111">Tela Produtos — onde ficam as alças de ordenação</text>

<g transform="translate(0,44)">
  <!-- ── reprodução fiel ── -->
  <rect x="109" y="0" width="72" height="36" rx="18" fill="rgb(18, 18, 22)"/>
  <rect x="188" y="0" width="88" height="36" rx="18" fill="rgb(255,255,255)" stroke="rgb(228,228,231)"/>
  <rect x="285" y="0" width="77" height="36" rx="18" fill="rgb(255,255,255)" stroke="rgb(228,228,231)"/>
  <rect x="369" y="0" width="89" height="36" rx="18" fill="rgb(255,255,255)" stroke="rgb(228,228,231)"/>
  <rect x="466" y="0" width="86" height="36" rx="18" fill="rgb(255,255,255)" stroke="rgb(228,228,231)"/>
  <rect x="109" y="99" width="528" height="189" rx="18" fill="rgb(255,255,255)" stroke="rgb(228,228,231)"/>
  <rect x="128" y="118" width="96" height="96" rx="15" fill="rgb(244,244,245)"/>
  <rect x="110" y="232" width="526" height="55" fill="none" stroke="rgb(228,228,231)"/>
  <rect x="653" y="99" width="320" height="189" rx="18" fill="rgb(255,255,255)" stroke="rgb(228,228,231)"/>
  <rect x="672" y="118" width="96" height="96" rx="15" fill="rgb(244,244,245)"/>
  <rect x="654" y="232" width="319" height="55" fill="none" stroke="rgb(228,228,231)"/>
  <rect x="109" y="304" width="528" height="56" rx="18" fill="rgb(255,255,255)" stroke="rgb(228,228,231)"/>
  <rect x="128" y="323" width="96" height="37" rx="15" fill="rgb(244,244,245)"/>
  <rect x="653" y="304" width="320" height="56" rx="18" fill="rgb(255,255,255)" stroke="rgb(228,228,231)"/>
  <rect x="672" y="323" width="96" height="37" rx="15" fill="rgb(244,244,245)"/>

  <text x="109" y="22" font-size="13.5" font-weight="600" fill="rgb(255,255,255)">Todas</text>
  <text x="188" y="22" font-size="13.5" font-weight="600" fill="rgb(113,113,122)">Combos</text>
  <text x="285" y="22" font-size="13.5" font-weight="600" fill="rgb(113,113,122)">Pizzas</text>
  <text x="369" y="22" font-size="13.5" font-weight="600" fill="rgb(113,113,122)">Lanches</text>
  <text x="466" y="22" font-size="13.5" font-weight="600" fill="rgb(113,113,122)">Bebidas</text>
  <text x="161" y="76" font-size="12.5" font-weight="800" fill="rgb(113,113,122)">Combos</text>
  <text x="234" y="76" font-size="12" fill="rgba(113,113,122,0.7)">4 itens</text>
  <g clip-path="url(#cardEsq)"><text x="242" y="136" font-size="16" font-weight="700" fill="rgb(18,18,22)">Combo Casal</text></g>
  <g clip-path="url(#cardEsq)"><text x="546" y="136" font-size="16" font-weight="800" fill="rgb(18,18,22)">R$ 69,90</text></g>
  <g clip-path="url(#cardEsq)"><text x="242" y="169" font-size="13.5" fill="rgb(113,113,122)">Pizza grande de até 2 sabores + refrigeran</text></g>
  <g clip-path="url(#cardEsq)"><text x="335" y="207" font-size="11.5" font-weight="600" fill="rgb(113,113,122)">3 complementos</text></g>
  <text x="176" y="265" font-size="12.5" font-weight="600" fill="rgb(18,18,22)">À venda</text>
  <g clip-path="url(#cardDir)"><text x="786" y="136" font-size="16" font-weight="700" fill="rgb(18,18,22)">Combo Duas Pizzas</text></g>
  <g clip-path="url(#cardDir)"><text x="786" y="169" font-size="13.5" fill="rgb(113,113,122)">Uma pizza gigante de 45cm…</text></g>
  <text x="720" y="265" font-size="12.5" font-weight="600" fill="rgb(18,18,22)">À venda</text>
  <g clip-path="url(#linhaEsq)"><text x="242" y="341" font-size="16" font-weight="700" fill="rgb(18,18,22)">Combo Solo</text></g>
  <g clip-path="url(#linhaEsq)"><text x="546" y="341" font-size="16" font-weight="800" fill="rgb(18,18,22)">R$ 44,90</text></g>
  <g clip-path="url(#linhaDir)"><text x="786" y="341" font-size="16" font-weight="700" fill="rgb(18,18,22)">Combo Família</text></g>

  <rect x="128" y="255" width="38" height="21" rx="10.5" fill="#f59e0b"/>
  <circle cx="155" cy="265.5" r="8" fill="#fff"/>
  <rect x="672" y="255" width="38" height="21" rx="10.5" fill="#f59e0b"/>
  <circle cx="699" cy="265.5" r="8" fill="#fff"/>

  <!-- alças, setas e ações: ícones na tela, redesenhados aqui -->
  <g fill="#a1a1aa" font-size="13" font-family="ui-monospace, Consolas, monospace">
    <text x="105" y="80">⠿</text>
    <text x="558" y="80">^</text><text x="574" y="80">v</text>
    <text x="431" y="266">⠿</text>
    <text x="459" y="266">^</text><text x="494" y="266">v</text>
    <text x="531" y="266">✎</text><text x="568" y="266">⧉</text><text x="600" y="266">🗑</text>
    <text x="847" y="266">⠿</text>
    <text x="875" y="266">^</text>
  </g>
</g>

<!-- ── marcações: ao lado do alvo, nunca por cima ── -->
<g font-size="11" font-weight="700" fill="#fff">
  <circle cx="92" cy="118" r="10" fill="#111"/><text x="92" y="122" text-anchor="middle">1</text>
  <circle cx="596" cy="118" r="10" fill="#111"/><text x="596" y="122" text-anchor="middle">2</text>
  <circle cx="409" cy="306" r="10" fill="#111"/><text x="409" y="310" text-anchor="middle">3</text>
  <circle cx="98" cy="309" r="10" fill="#111"/><text x="98" y="313" text-anchor="middle">4</text>
</g>

<!-- ── legenda ── -->
<rect x="0" y="424" width="900" height="200" fill="#fafafa"/>
<path d="M0 424 h900" stroke="#e4e4e7"/>
<g font-size="12.5">
  <circle cx="30" cy="504" r="9" fill="#111"/><text x="30" y="508" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">1</text>
  <text x="48" y="508"><tspan font-weight="700" fill="#111">Alça da categoria</tspan><tspan fill="#71717a"> — arrasta o bloco inteiro: a categoria e todos os produtos dela.</tspan></text>

  <circle cx="30" cy="536" r="9" fill="#111"/><text x="30" y="540" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">2</text>
  <text x="48" y="540"><tspan font-weight="700" fill="#111">Setas ↑ ↓</tspan><tspan fill="#71717a"> — mesma coisa, um passo por clique. No celular use estas: arrastar não funciona.</tspan></text>

  <circle cx="30" cy="568" r="9" fill="#111"/><text x="30" y="572" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">3</text>
  <text x="48" y="572"><tspan font-weight="700" fill="#111">Alça do produto</tspan><tspan fill="#71717a"> — move só dentro da categoria dele; não pula para outra.</tspan></text>

  <circle cx="30" cy="600" r="9" fill="#111"/><text x="30" y="604" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">4</text>
  <text x="48" y="604"><tspan font-weight="700" fill="#111">Chave “À venda”</tspan><tspan fill="#71717a"> — desligada, o produto some do cardápio do cliente e continua aqui para você.</tspan></text>
</g>

<text x="20" y="454" font-size="11.5" font-weight="700" fill="#111">As alças somem quando há busca ou filtro de categoria ativo.</text>
<text x="20" y="470" font-size="11.5" fill="#71717a">Com meia lista na tela a posição solta não seria a real — clique em “Todas” para voltar a ordenar.</text>
</svg>
