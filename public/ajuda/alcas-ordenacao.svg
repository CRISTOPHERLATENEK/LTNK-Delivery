<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="700" height="360" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif">
  <rect width="700" height="360" fill="#fff"/>
  <text x="24" y="30" font-size="15" font-weight="700" fill="#111">Onde ficam as alças de ordenação</text>
  <text x="24" y="50" font-size="12.5" fill="#8a8a8a">na lista de Produtos — vale para os três níveis</text>

  <rect x="24" y="68" width="440" height="250" rx="12" fill="#fafaf9" stroke="#e3e0dc"/>

  <g font-size="12.5">
    <text x="44" y="96" font-size="14" fill="#a8a29e">⠿</text>
    <text x="66" y="97" font-weight="800" fill="#111" letter-spacing="1">PIZZAS</text>
    <text x="130" y="97" fill="#8a8a8a">7 itens</text>
    <path d="M182 92 h206" stroke="#e3e0dc"/>
    <text x="400" y="97" fill="#a8a29e">↑ ↓</text>

    <text x="64" y="126" font-size="13" fill="#a8a29e">⠿</text>
    <text x="84" y="127" fill="#8a8a8a" letter-spacing=".5">Monte a sua</text>
    <text x="400" y="127" fill="#a8a29e">↑ ↓</text>

    <rect x="84" y="140" width="150" height="46" rx="8" fill="#fff" stroke="#d8d4cf"/>
    <text x="98" y="160" font-size="12.5" font-weight="700" fill="#111">Pizza Artesanal</text>
    <text x="98" y="177" font-size="12" fill="#8a8a8a">R$ 45,00</text>
    <text x="200" y="177" font-size="12" fill="#a8a29e">⠿ ↑ ↓</text>

    <text x="64" y="212" font-size="13" fill="#a8a29e">⠿</text>
    <text x="84" y="213" fill="#8a8a8a" letter-spacing=".5">Prontas</text>
    <text x="400" y="213" fill="#a8a29e">↑ ↓</text>

    <rect x="84" y="226" width="150" height="46" rx="8" fill="#fff" stroke="#d8d4cf"/>
    <text x="98" y="246" font-size="12.5" font-weight="700" fill="#111">Quatro Queijos</text>
    <text x="98" y="263" font-size="12" fill="#8a8a8a">R$ 52,00</text>
    <text x="200" y="263" font-size="12" fill="#a8a29e">⠿ ↑ ↓</text>

    <text x="44" y="300" font-size="14" fill="#a8a29e">⠿</text>
    <text x="66" y="301" font-weight="800" fill="#111" letter-spacing="1">LANCHES</text>
    <text x="400" y="301" fill="#a8a29e">↑ ↓</text>
  </g>

  <path d="M470 96 h-58" stroke="#111" stroke-width="1.4"/>
  <text x="478" y="92" font-size="12.5" font-weight="700" fill="#111">categoria</text>
  <path d="M470 213 h-58" stroke="#111" stroke-width="1.4"/>
  <text x="478" y="209" font-size="12.5" font-weight="700" fill="#111">faixa</text>
  <path d="M470 263 h-244" stroke="#111" stroke-width="1.4"/>
  <text x="478" y="259" font-size="12.5" font-weight="700" fill="#111">produto</text>

  <text x="478" y="126" font-size="12" fill="#8a8a8a">a 1ª é a primeira que</text>
  <text x="478" y="142" font-size="12" fill="#8a8a8a">o cliente vê</text>
  <text x="478" y="286" font-size="12" fill="#8a8a8a">no celular use as setas:</text>
  <text x="478" y="302" font-size="12" fill="#8a8a8a">arrastar não funciona</text>
  <text x="478" y="318" font-size="12" fill="#8a8a8a">em tela de toque</text>

  <rect x="24" y="330" width="652" height="0.5" fill="#e8e5e1"/>
  <text x="24" y="352" font-size="12.5" fill="#444">
    <tspan font-weight="700">As alças somem com busca ou filtro ativo.</tspan>
    <tspan fill="#8a8a8a"> Com meia lista na tela, a posição enviada não seria a real — clique em “Todas”.</tspan>
  </text>
</svg>
