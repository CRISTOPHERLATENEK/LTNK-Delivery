# Teto de requisicoes por IP — camada que faltava.
#
# A Cloudflare barra ataque volumetrico (camada 3/4), mas no plano free nao
# filtra trafego que PARECE legitimo. O teto do app foi medido em ~440 req/s:
# algumas centenas de requisicoes bem escolhidas por segundo derrubavam o site
# e a Cloudflare nao piscava. Isso aqui fecha essa porta.
#
# $binary_remote_addr e o IP REAL do visitante, nao o da Cloudflare — quem
# garante isso e o `real_ip_header CF-Connecting-IP` do cloudflare-realip.conf.
# Se aquele include sair, este limite passa a contar o edge da Cloudflare e
# estrangula todo mundo junto. Os dois andam juntos.
#
# CALIBRAGEM (proposital folgada): uma loja com painel do lojista + 2 tablets de
# cozinha + PDV atras de um NAT so gasta ~8 req/s sustentados (o front faz
# polling, o mais rapido a cada 3s). 30 r/s deixa 4x de margem, e burst=60
# absorve o carregamento frio de pagina, que dispara 30-50 requisicoes de uma vez.
# Aperta depois se precisar; comecar apertado bloqueia cliente pagante.
limit_req_zone  $binary_remote_addr zone=geral:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=conexoes:10m;

# FOTO DE PRODUTO NAO E CHAMADA DE API, e por isso tem teto proprio.
#
# Medido em 18/09/2026, no error.log: 1.400 requisicoes recusadas com 429 em um
# dia, 1.398 delas em /uploads/, todas em galderio-bebidas. Um IP com varios
# aparelhos (dois Chrome e um iPhone, o dia inteiro) levou 429 em 17% das 5.536
# requisicoes dele — o formato de uma loja com painel, tablet de cozinha e PDV
# atras de um NAT so, que e exatamente o cenario que a calibragem de 30r/s
# tentou cobrir e subestimou.
#
# A conta que faltou: a pagina do cardapio pede UMA FOTO POR PRODUTO. Um
# cardapio com 80 itens dispara ~80 requisicoes de uma vez, so de imagem —
# sozinho ja estoura o burst=60 pensado para "30-50 requisicoes" de carga fria.
#
# O raciocinio nao e novo neste arquivo: o bloco /download/ do site ja ficou
# FORA do location / com a mesma justificativa escrita — "um download longo nao
# deve competir com o teto pensado pra chamadas de API". Vale igual aqui.
#
# 100r/s com burst=200 absorve o cardapio inteiro de varios aparelhos juntos e
# continua sendo teto: quem protege contra saturacao de verdade e o
# limit_conn de 40 conexoes simultaneas, que segue valendo.
limit_req_zone  $binary_remote_addr zone=estaticos:10m rate=100r/s;

# 429 e nao o 503 padrao: 503 diz "servidor quebrado" e faz a Cloudflare e os
# navegadores tratarem como falha nossa. 429 diz "voce passou do limite".
limit_req_status  429;
limit_conn_status 429;
