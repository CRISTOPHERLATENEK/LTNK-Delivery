# maxxpedidos.com.br — dominio principal da plataforma (novo) + subdominios de
# clientes. Um certificado so cobre apex e curinga.
#
# `proxy_set_header Host $host` e o que faz o multi-cliente funcionar: e pelo
# Host que o sistema descobre de quem e a requisicao.
server {
    listen 443 ssl;
    # IPv6 TAMBEM. O servidor tem endereco IPv6 publico e a Cloudflare pode usar
    # o AAAA como origem; sem alguem escutando aqui, essas conexoes ficam
    # PENDURADAS ate estourar — e o site aparece "lento as vezes" em vez de
    # fora do ar. Medido: IPv4 respondia em 21ms, IPv6 nao respondia.
    listen [::]:443 ssl;
    include /etc/nginx/cloudflare-realip.conf;
    server_name maxxpedidos.com.br www.maxxpedidos.com.br *.maxxpedidos.com.br;

    client_max_body_size 20m;

    # Download do instalador do agente de impressao (~96MB).
    #
    # Servido pelo nginx e nao pelo Node: um arquivo de 96MB atravessando o
    # Express ocupa um dos 3 processos do cluster durante todo o download, e
    # dois lojistas baixando ao mesmo tempo estrangulariam o painel.
    #
    # Mora em /var/www/downloads e nao dentro de /opt/delivery porque o deploy
    # faz `git reset --hard`: no repo, o arquivo seria apagado a cada deploy (ou
    # exigiria versionar 96MB de binario no git, que e pior).
    #
    # Fora do `location /`, entao NAO herda o limit_req de 30r/s daquele bloco —
    # um download longo nao deve competir com o teto pensado pra chamadas de API.
    location /download/ {
        alias /var/www/downloads/;
        autoindex off;
        default_type application/octet-stream;
        add_header Content-Disposition "attachment";
        add_header X-Content-Type-Options nosniff;
    }

    # As fotos dos produtos, SERVIDAS DO DISCO — sem passar pelo Node.
    #
    # Antes isto era proxy para o Express (`express.static` em server.ts). Cada
    # cardapio aberto sao dezenas de imagens, e todas atravessavam um dos 3
    # processos do cluster — os mesmos que atendem pedido, cozinha e PDV. O
    # nginx entrega arquivo estatico sem acordar o Node, que e o trabalho dele.
    #
    # E O MESMO DIRETORIO DE ANTES: `UPLOAD_DIR = path.resolve('./dados/uploads')`
    # com a app rodando em /opt/delivery. Diretorio PLANO, sem separacao por
    # cliente — o Node tambem servia assim, entao nao ha isolamento a preservar
    # aqui (o nome do arquivo e aleatorio, gerado no upload).
    #
    # `try_files ... =404` porque o Express ja respondia 404 em arquivo que nao
    # existe: comportamento igual, sem cair no catch-all do app.
    #
    # NOSNIFF VOLTA NA MAO. Ele vinha do middleware do Node e sem o proxy some;
    # e a defesa contra o navegador adivinhar que um upload e HTML. O resto dos
    # cabecalhos de seguranca (CSP, frame-options) so vale para documento, nao
    # para imagem.
    #
    # CACHE LONGO, que o Node nao dava (`max-age=0`, revalidando toda vez): o
    # nome do arquivo e hexadecimal aleatorio e nunca e reescrito — trocar a
    # foto gera nome novo. Entao o conteudo de uma URL destas nao muda nunca, e
    # `immutable` e literalmente verdade.
    location /uploads/ {
        alias /opt/delivery/dados/uploads/;
        try_files $uri =404;

        autoindex off;
        add_header X-Content-Type-Options nosniff;
        add_header Cache-Control "public, max-age=31536000, immutable";

        # Sem limit_req: arquivo estatico servido pelo nginx nao disputa o teto
        # pensado pra chamada de API. O limit_conn continua valendo — e ele quem
        # protege contra saturacao de verdade.
        limit_conn conexoes 40;
    }

    location / {
        # Ver /etc/nginx/conf.d/limites.conf pra calibragem e o porque.
        # nodelay: as 60 da rajada passam na hora em vez de virarem fila de
        # 2 segundos — sem isso, o carregamento de pagina fica lento de proposito.
        limit_req  zone=geral burst=60 nodelay;
        limit_conn conexoes 40;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    ssl_certificate /etc/letsencrypt/live/maxxpedidos/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maxxpedidos/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name maxxpedidos.com.br www.maxxpedidos.com.br *.maxxpedidos.com.br;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
