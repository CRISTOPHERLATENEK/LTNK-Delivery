# COMPRESSÃO DOS ESTÁTICOS — o bloco gzip do /etc/nginx/nginx.conf.
#
# POR QUE ISTO EXISTE AQUI: o Ubuntu vem com `gzip on;` e TODO o resto
# comentado, inclusive `gzip_types`. Sem `gzip_types`, o nginx comprime apenas
# `text/html` — que é o default embutido. Ou seja: a linha `gzip on` estava lá,
# parecia ligada, e o JS e o CSS saíam CRUS.
#
# Medido em 09/09/2026, no primeiro acesso ao app:
#
#   9 arquivos, 980.438 bytes crus
#   comprimidos:  292.808 bytes  (70% de desperdício)
#
#   index-<hash>.js    419.509 → 129.920 bytes
#   index-<hash>.css   103.607 →  18.062 bytes
#
# O lojista reclamou que "demora dois anos pra carregar", e era isto: três
# vezes mais bytes do que precisava, em toda visita.
#
# CONFIG DE MÁQUINA MORA NO REPOSITÓRIO porque config que só existe no servidor
# volta ao padrão numa máquina nova, numa reinstalação do nginx ou num
# `apt upgrade` que substitua o arquivo — e o sintoma de volta é "o site está
# lento", que ninguém liga ao nginx.
#
# COMO APLICAR: substituir o bloco "Gzip Settings" de /etc/nginx/nginx.conf
# pelo conteúdo abaixo, e então:
#
#   nginx -t && systemctl reload nginx
#
# A cópia do arquivo original ficou em /etc/nginx/nginx.conf.antes-gzip.
#
# NÃO comprimir imagens (png/jpg/webp) nem vídeo: já são formatos comprimidos,
# e passar gzip neles gasta CPU para às vezes AUMENTAR o arquivo. SVG entra
# porque é texto.
#
# `gzip_min_length 1024`: abaixo disso o cabeçalho do gzip custa mais que a
# economia.
#
# `gzip_proxied any` é necessário aqui porque o tráfego chega pela Cloudflare;
# sem ele o nginx não comprime resposta para requisição vinda de proxy.

	gzip on;

	gzip_vary on;
	gzip_proxied any;
	gzip_comp_level 6;
	gzip_min_length 1024;
	gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml application/xml text/xml;
