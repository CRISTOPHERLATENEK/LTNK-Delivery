<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif">
  <rect width="700" height="300" fill="#fff"/>
  <text x="24" y="30" font-size="15" font-weight="700" fill="#111">Os dois jeitos de fechar a loja</text>
  <text x="24" y="50" font-size="12.5" fill="#8a8a8a">valem quando o horário automático está ligado</text>

  <rect x="24" y="70" width="316" height="176" rx="12" fill="#fff" stroke="#e3e0dc"/>
  <rect x="44" y="92" width="140" height="36" rx="9" fill="#fdf3f1" stroke="#e8c4bc"/>
  <text x="114" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#a33a28">Fechar agora</text>
  <text x="44" y="152" font-size="13" font-weight="700" fill="#111">Pausa de 2 horas</text>
  <text x="44" y="172" font-size="12.5" fill="#8a8a8a">Depois a loja REABRE SOZINHA.</text>
  <text x="44" y="196" font-size="12.5" fill="#444">Use para pausa curta:</text>
  <text x="44" y="214" font-size="12.5" fill="#8a8a8a">fila cheia, faltou insumo.</text>

  <rect x="360" y="70" width="316" height="176" rx="12" fill="#fff" stroke="#e3e0dc"/>
  <rect x="380" y="92" width="150" height="36" rx="9" fill="#f6f5f3" stroke="#d8d4cf"/>
  <text x="455" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Encerrar o dia</text>
  <text x="380" y="152" font-size="13" font-weight="700" fill="#111">Até a próxima abertura</text>
  <text x="380" y="172" font-size="12.5" fill="#8a8a8a">Segue a agenda da semana.</text>
  <text x="380" y="196" font-size="12.5" fill="#444">Use quando for embora:</text>
  <text x="380" y="214" font-size="12.5" fill="#8a8a8a">noite fraca, acabou o estoque.</text>

  <path d="M24 262 h652" stroke="#e8e5e1"/>
  <text x="24" y="286" font-size="12.5" fill="#444">
    <tspan font-weight="700">A mensagem diz a hora exata em que ela reabre.</tspan>
    <tspan fill="#8a8a8a"> Leia antes de sair.</tspan>
  </text>
</svg>
