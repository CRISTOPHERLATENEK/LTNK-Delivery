<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif">
  <rect width="700" height="300" fill="#fff"/>
  <text x="24" y="30" font-size="15" font-weight="700" fill="#111">A cozinha recebe de três lugares</text>
  <text x="24" y="50" font-size="12.5" fill="#8a8a8a">e tudo entra na mesma fila, por ordem de chegada</text>

  <g font-size="12.5">
    <rect x="24" y="76" width="150" height="40" rx="9" fill="#fafaf9" stroke="#e3e0dc"/>
    <text x="99" y="101" text-anchor="middle" fill="#111">Delivery</text>
    <rect x="24" y="126" width="150" height="40" rx="9" fill="#fafaf9" stroke="#e3e0dc"/>
    <text x="99" y="151" text-anchor="middle" fill="#111">Balcão</text>
    <rect x="24" y="176" width="150" height="40" rx="9" fill="#fafaf9" stroke="#e3e0dc"/>
    <text x="99" y="201" text-anchor="middle" fill="#111">Mesa</text>
  </g>
  <g stroke="#c9c4be" stroke-width="1.5" fill="none">
    <path d="M174 96 C 210 96, 210 146, 240 146"/>
    <path d="M174 146 h66"/>
    <path d="M174 196 C 210 196, 210 146, 240 146"/>
    <path d="M232 141 l8 5 l-8 5"/>
  </g>

  <rect x="248" y="76" width="428" height="140" rx="12" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="268" y="100" font-size="13" font-weight="700" fill="#111">Fila da cozinha (KDS)</text>

  <rect x="268" y="112" width="388" height="42" rx="8" fill="#fafaf9" stroke="#e3e0dc"/>
  <text x="282" y="130" font-size="12.5" font-weight="700" fill="#111">1x  Pizza Artesanal</text>
  <text x="296" y="146" font-size="12" fill="#111">Grande · Camarão · Borda Catupiry</text>
  <text x="600" y="130" font-size="11" fill="#8a8a8a">o QUE fazer</text>

  <rect x="268" y="160" width="388" height="40" rx="8" fill="#fff" stroke="#e8c4bc"/>
  <text x="282" y="185" font-size="12.5" font-weight="700" fill="#a33a28">&gt;&gt; SEM CEBOLA &lt;&lt;</text>
  <text x="600" y="185" font-size="11" fill="#a33a28">o COMO</text>

  <path d="M24 240 h652" stroke="#e8e5e1"/>
  <text x="24" y="260" font-size="12.5" fill="#444">
    <tspan font-weight="700">Composição e observação são coisas diferentes, e por isso têm tratamentos diferentes.</tspan>
  </text>
  <text x="24" y="280" font-size="12.5" fill="#8a8a8a">
    A composição é o que produzir; a observação é a instrução do cliente, realçada para não passar batida.
  </text>
</svg>
