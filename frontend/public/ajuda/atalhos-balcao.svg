<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" height="320" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif">
  <rect width="700" height="320" fill="#fff"/>
  <text x="24" y="30" font-size="15" font-weight="700" fill="#111">Escolher pelo número</text>
  <text x="24" y="50" font-size="12.5" fill="#8a8a8a">digite o número completo — a mão não sai do teclado</text>

  <g font-family="ui-monospace, SF Mono, Consolas, monospace">
    <rect x="24" y="72" width="34" height="34" rx="7" fill="#fafaf9" stroke="#a8a29e"/>
    <text x="41" y="95" text-anchor="middle" font-size="15" font-weight="700" fill="#111">2</text>
    <rect x="62" y="72" width="34" height="34" rx="7" fill="#fafaf9" stroke="#a8a29e"/>
    <text x="79" y="95" text-anchor="middle" font-size="15" font-weight="700" fill="#111">8</text>

    <rect x="24" y="128" width="34" height="34" rx="7" fill="#fafaf9" stroke="#a8a29e"/>
    <text x="41" y="151" text-anchor="middle" font-size="15" font-weight="700" fill="#111">3</text>

    <rect x="24" y="192" width="46" height="34" rx="7" fill="#fafaf9" stroke="#a8a29e"/>
    <text x="47" y="215" text-anchor="middle" font-size="14" font-weight="700" fill="#111">99</text>
  </g>

  <text x="116" y="86" font-size="13" font-weight="700" fill="#111">Marca a opção 28</text>
  <text x="116" y="104" font-size="12.5" fill="#8a8a8a">o número aplica assim que só puder ser um</text>

  <text x="116" y="142" font-size="13" font-weight="700" fill="#111">Pode ficar esperando</text>
  <text x="116" y="160" font-size="12.5" fill="#8a8a8a">numa lista longa, “3” ainda pode virar 31 ou 38</text>
  <text x="116" y="178" font-size="12.5" fill="#8a8a8a">o dígito aparece no topo da janela e some quando aplica</text>

  <text x="116" y="206" font-size="13" font-weight="700" fill="#a33a28">99 · não existe</text>
  <text x="116" y="224" font-size="12.5" fill="#8a8a8a">o número não está na lista. Não é a tecla que falhou</text>

  <rect x="24" y="248" width="652" height="0.5" fill="#e8e5e1"/>
  <g font-size="12.5">
    <text x="24" y="272" font-weight="700" fill="#111">Enter</text>
    <text x="90" y="272" fill="#8a8a8a">adiciona à venda</text>
    <text x="240" y="272" font-weight="700" fill="#111">Esc</text>
    <text x="290" y="272" fill="#8a8a8a">cancela o item</text>
    <text x="440" y="272" font-weight="700" fill="#111">Backspace</text>
    <text x="530" y="272" fill="#8a8a8a">limpa o número</text>
  </g>
  <text x="24" y="302" font-size="12.5" fill="#444">
    <tspan font-weight="700">Botão claro não é botão travado.</tspan>
    <tspan fill="#8a8a8a"> Falta alguma escolha — clique nele e ele leva até o grupo que falta.</tspan>
  </text>
</svg>
