<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif">
  <rect width="760" height="250" fill="#fff"/>
  <text x="24" y="30" font-size="15" font-weight="700" fill="#111">Como a mesa funciona</text>
  <text x="24" y="50" font-size="12.5" fill="#8a8a8a">do primeiro pedido até a mesa ficar livre</text>

  <g font-size="12.5">
    <rect x="24" y="76" width="122" height="58" rx="10" fill="#fafaf9" stroke="#e3e0dc"/>
    <text x="85" y="100" text-anchor="middle" font-weight="700" fill="#111">Abrir mesa</text>
    <text x="85" y="119" text-anchor="middle" fill="#8a8a8a">toque na mesa livre</text>

    <rect x="170" y="76" width="140" height="58" rx="10" fill="#fafaf9" stroke="#e3e0dc"/>
    <text x="240" y="100" text-anchor="middle" font-weight="700" fill="#111">Adicionar itens</text>
    <text x="240" y="119" text-anchor="middle" fill="#8a8a8a">com complementos</text>

    <rect x="334" y="76" width="164" height="58" rx="10" fill="#fff" stroke="#111" stroke-width="1.5"/>
    <text x="416" y="100" text-anchor="middle" font-weight="700" fill="#111">Enviar para produção</text>
    <text x="416" y="119" text-anchor="middle" fill="#8a8a8a">cozinha + comanda impressa</text>

    <rect x="522" y="76" width="112" height="58" rx="10" fill="#fafaf9" stroke="#e3e0dc"/>
    <text x="578" y="100" text-anchor="middle" font-weight="700" fill="#111">Conta</text>
    <text x="578" y="119" text-anchor="middle" fill="#8a8a8a">ícone de impressora</text>

    <rect x="658" y="76" width="78" height="58" rx="10" fill="#fafaf9" stroke="#e3e0dc"/>
    <text x="697" y="100" text-anchor="middle" font-weight="700" fill="#111">Fechar</text>
    <text x="697" y="119" text-anchor="middle" fill="#8a8a8a">mesa livre</text>
  </g>

  <g stroke="#c9c4be" stroke-width="1.5" fill="none">
    <path d="M146 105 h20"/><path d="M160 100 l6 5 l-6 5"/>
    <path d="M310 105 h20"/><path d="M324 100 l6 5 l-6 5"/>
    <path d="M498 105 h20"/><path d="M512 100 l6 5 l-6 5"/>
    <path d="M634 105 h20"/><path d="M648 100 l6 5 l-6 5"/>
  </g>

  <path d="M416 134 C 416 176, 240 176, 240 138" fill="none" stroke="#111" stroke-width="1.4" stroke-dasharray="4 4"/>
  <path d="M246 146 l-6 -8 l-6 8" fill="none" stroke="#111" stroke-width="1.4"/>
  <text x="330" y="192" text-anchor="middle" font-size="12.5" font-weight="700" fill="#111">pediu mais? volte e envie de novo</text>
  <text x="330" y="209" text-anchor="middle" font-size="12" fill="#8a8a8a">só vai o que ainda não foi enviado</text>

  <path d="M24 226 h712" stroke="#e8e5e1"/>
  <text x="24" y="244" font-size="12.5" fill="#8a8a8a">A conta e o envio à cozinha são coisas separadas — a conta pode ser impressa quantas vezes precisar.</text>
</svg>
