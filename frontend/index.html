<!doctype html>
<html lang="pt-BR" class="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#dc2640" />
    <meta name="description" content="Sistema de gestão de delivery com app próprio, NFC-e integrada, KDS e PDV. Com o seu domínio e a sua marca." />
    <!-- PWA: app instalável (manifest dinâmico gerado pelo backend a partir da marca) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Delivery Já" />
    <!--
      Ícone padrão da aba. SEM ISTO O CONSOLE DAVA 404 EM TODA CARGA: não existe
      /favicon.ico no projeto (o arquivo é favicon.svg), e sem nenhum <link
      rel="icon"> o navegador pede /favicon.ico por conta própria — dois 404 por
      página, um do apple-touch-icon e um do pedido automático.

      O tema (lib/tema.ts) troca o href quando a plataforma ou a loja tem favicon
      próprio; este aqui é o que aparece quando NENHUM dos dois tem — antes disso
      era a aba sem ícone.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/mascote/mascote.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <title>Delivery Já</title>
    <script>
      // Aplica modo claro/escuro antes do React montar (evita flash).
      // A preferência é POR ÁREA (cliente/lojista/entregador/cozinha/admin) —
      // não é compartilhada entre os painéis.
      (() => {
        const p = location.pathname;
        const area = p.startsWith('/lojista') ? 'lojista'
          : p.startsWith('/entregador') ? 'entregador'
          : p.startsWith('/cozinha') ? 'cozinha'
          : p.startsWith('/painel-admin') ? 'admin'
          : 'cliente';
        const tema = localStorage.getItem('tema:' + area);
        const sistema = matchMedia('(prefers-color-scheme: dark)').matches;
        if (tema === 'escuro' || (!tema && sistema)) document.documentElement.classList.add('dark');
      })();
      // Reaplica a cor da marca (cacheada no último acesso) ANTES do React montar,
      // evitando o flash da cor padrão (vermelho) no F5.
      (() => {
        try {
          const pal = JSON.parse(localStorage.getItem('paleta-marca') || 'null');
          if (!pal) return;
          const r = document.documentElement.style;
          const dark = document.documentElement.classList.contains('dark');
          r.setProperty('--primary', pal.primary);
          r.setProperty('--ring', pal.ring);
          r.setProperty('--primary-foreground', pal.primaryFg);
          r.setProperty('--accent', dark ? pal.accentDark : pal.accentLight);
          r.setProperty('--accent-foreground', dark ? pal.accentFgDark : pal.accentFgLight);
        } catch (e) {}
      })();
    </script>
    <script>
      /*
       * REDE DE SEGURANCA DO BUNDLE DE ENTRADA.
       *
       * O `lazySeguro` (lib/lazy-seguro.ts) ja recarrega a pagina quando um
       * chunk de ROTA some do servidor depois de um deploy. Mas ele e codigo
       * nosso: para ele rodar, o bundle principal precisa ter carregado. Quando
       * quem some e o proprio `index-<hash>.js` ou o `index-<hash>.css`, nada
       * nosso chega a executar — a aba fica BRANCA, sem erro na tela e sem
       * caminho de volta a nao ser um Ctrl+Shift+R que ninguem vai adivinhar.
       *
       * Medido em 09/09/2026: 37 pedidos de asset levaram 404 num intervalo de
       * 20 segundos durante um deploy, e entre eles estavam o index .js e o
       * index .css. Quem estava com o app aberto ficou na tela branca.
       *
       * ESTE TRECHO E INLINE, NO HTML, de proposito: ele precisa existir
       * mesmo quando nenhum arquivo externo carregou. Por isso tambem nao usa
       * nada de fora — nem modulo, nem funcao nossa.
       *
       * UMA tentativa por sessao, marcada em sessionStorage. Se recarregar nao
       * resolver (o problema era outro: rede caindo, servidor fora), o segundo
       * erro passa direto e a pessoa ve a falha de verdade em vez de entrar num
       * laco de reload — que e bem pior que a tela branca.
       */
      (() => {
        const CHAVE = 'entrada-recarregada';
        let jaPedi = false;
        function recarregarUmaVez(motivo) {
          if (jaPedi) return;
          try {
            if (sessionStorage.getItem(CHAVE) === '1') return;
            sessionStorage.setItem(CHAVE, '1');
          } catch (e) { /* modo privativo: segue sem a trava */ }
          jaPedi = true;
          console.warn('[entrada] ' + motivo + ' — recarregando para pegar a versao nova.');
          /*
           * `location.reload()` e nao um replace na mesma URL: o service worker
           * trata navegacao como rede-primeiro, entao o reload traz o
           * index.html NOVO, que aponta para os hashes que existem hoje.
           */
          location.reload();
        }

        /*
         * Captura na fase de CAPTURA porque erro de carregamento de recurso nao
         * borbulha — um listener normal no window nunca veria.
         */
        window.addEventListener('error', (e) => {
          const alvo = e && e.target;
          if (!alvo || alvo === window) return;
          const url = alvo.src || alvo.href || '';
          /* So os assets com hash: 404 neles significa "sua aba esta velha".
             Imagem quebrada ou script de terceiro nao recarregam nada. */
          if (typeof url === 'string' && url.indexOf('/app-assets/') !== -1) {
            recarregarUmaVez('falhou ao carregar ' + url);
          }
        }, true);

        /* O Vite avisa por evento proprio quando um modulo pre-carregado falha. */
        window.addEventListener('vite:preloadError', () => {
          recarregarUmaVez('preload de modulo falhou');
        });

        /*
         * A TRAVA SO SAI SE O APP REALMENTE SUBIU.
         *
         * O `load` da janela dispara mesmo com a tela branca — o documento
         * terminou de carregar, com script quebrado e tudo. Limpar a trava ali
         * devolveria o direito de recarregar a uma aba que acabou de falhar, e
         * duas abas nesse estado ficam num pingue-pongue de reload contra um
         * servidor que nao tem o arquivo.
         *
         * O sinal de que a entrada funcionou e o React ter montado: `#root`
         * deixa de estar vazio. Esse teste nao depende de nada nosso ter sido
         * carregado, que e o ponto deste trecho inteiro.
         */
        window.addEventListener('load', () => {
          setTimeout(() => {
            const raiz = document.getElementById('root');
            if (raiz && raiz.childElementCount > 0) {
              try { sessionStorage.removeItem(CHAVE); } catch (e) {}
            }
          }, 3000);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Registra o service worker (habilita instalação como app no celular)
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
